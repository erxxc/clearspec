# semianalyst runtime configuration.
# Loaded exclusively by src/semianalyst/config.py. Nothing else reads this file.

[model]
# Extraction model + prompt version. Used by `semianalyst extract` (run_extract):
# reads each ingested raw doc, runs this prompt through the model, validates +
# grounds the proposal, and persists claims (WS-1, see docs/ROADMAP.md).
# The API key is read from the ANTHROPIC_API_KEY environment variable, never stored here.
name = "claude-opus-4-8"
prompt_version = "extract_foundry_v1"

[paths]
data_dir = "data"
raw_dir  = "data/raw"          # content-addressed raw docs, keyed by sha256
db_path  = "data/semianalyst.db"

[rate_limits]
# Applied by `semianalyst ingest` (run_ingest): sequential fetching with a
# min-interval sleep of 60/requests_per_minute seconds between requests.
requests_per_minute = 10
max_concurrency     = 2

# Watchlist of sources. doc_type and source_tier map to the schema enums:
#   source_tier: 1=conference, 2=foundry, 3=vendor
# `url` is the source's index page (identification only this phase); `documents`
# lists explicit document URLs to fetch — the WS-2b direct-URL scope. Discovering
# document URLs by crawling the index page is HTML-discovery work, deferred to
# WS-3. `publisher` (optional) names the sidecar publisher; defaults to `name`.
[[sources]]
name        = "TSMC Technology"
url         = "https://pr.tsmc.com/english/news"
doc_type    = "foundry_announcement"
source_tier = 2
# documents = ["https://pr.tsmc.com/english/news/<file>.pdf"]  # explicit URLs until WS-3 discovery

[[sources]]
name        = "Samsung Foundry"
url         = "https://semiconductor.samsung.com/foundry/newsroom/"
doc_type    = "foundry_announcement"
source_tier = 2
# documents = ["https://semiconductor.samsung.com/foundry/newsroom/<file>.pdf"]  # explicit URLs until WS-3 discovery

[[sources]]
name        = "Intel Foundry"
url         = "https://www.intel.com/content/www/us/en/newsroom/home.html"
doc_type    = "foundry_announcement"
source_tier = 2
# documents = ["https://www.intel.com/content/dam/www/central-libraries/us/en/documents/<file>.pdf"]  # explicit URLs until WS-3 discovery


# ---------------------------------------------------------------------------
# GEI-14 curated advisory JSON sources (NVD API / GHSA / CISA KEV).
# Explicit document URLs only — no HTML discovery / vendor pages.
# parser_role mapping (attested via KIND_COMPAT; never written as kind):
#   nvd_record + cna|cpe|catalog|exploit_field
#   ghsa       + reviewed|unreviewed|exploit_field
#   cisa_kev   + kev
# Sidecar stores doc_type + publisher + parser_role; extract stamps kind.
# ---------------------------------------------------------------------------
[[sources]]
name        = "NVD CVE API"
url         = "https://services.nvd.nist.gov/rest/json/cves/2.0"
publisher   = "NVD"
doc_type    = "nvd_record"
source_tier = 3
parser_role = "cpe"
# documents = ["https://services.nvd.nist.gov/rest/json/cves/2.0?cveId=CVE-2024-3400"]

[[sources]]
name        = "GitHub Security Advisories"
url         = "https://api.github.com/advisories"
publisher   = "GitHub"
doc_type    = "ghsa"
source_tier = 3
parser_role = "reviewed"
# documents = ["https://api.github.com/advisories/GHSA-jfh8-c2jp-5v3q"]

[[sources]]
name        = "CISA KEV Catalog"
url         = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
publisher   = "CISA"
doc_type    = "cisa_kev"
source_tier = 3
parser_role = "kev"
# documents = ["https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"]
