# Offline pytest gate for pull requests and main.
# Deliberately excludes @live Anthropic tests and does not fetch NVD/GHSA/CISA.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: offline pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.12"
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # GitHub Actions sets CI=true; missing-recording skips fail (see conftest).
      - name: Run offline tests
        run: uv run pytest -m "not live" --tb=short
