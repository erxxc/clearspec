[project]
name = "semianalyst"
version = "0.1.0"
description = "Ingest semiconductor technical releases, extract quantitative claims into a canonical schema, and corroborate across sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=0.40",   # extraction model call (GATE-1 approved dependency)
    "pypdf>=5.0",        # PDF -> text for the extractor
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
semianalyst = "semianalyst.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semianalyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # ENFORCE posture: these hit the real Anthropic model. Skipped unless
    # `--run-live` is passed AND ANTHROPIC_API_KEY is set. They are the
    # mandatory CI anchor — `uv run pytest --run-live` is the real gate.
    "live: exercises the real Anthropic model (needs --run-live + ANTHROPIC_API_KEY)",
]

[dependency-groups]
# uv reads this for `uv sync`; mirrors the [dev] extra above.
dev = [
    "pytest>=8.0",
]
