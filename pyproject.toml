[project]
name = "semianalyst"
version = "0.1.0"
description = "Ingest semiconductor technical releases, extract quantitative claims into a canonical schema, and corroborate across sources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
semianalyst = "semianalyst.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semianalyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = false  # extract is stubbed; golden harness xfails until it lands

[dependency-groups]
# uv reads this for `uv sync`; mirrors the [dev] extra above.
dev = [
    "pytest>=8.0",
]
